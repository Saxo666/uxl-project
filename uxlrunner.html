  <div class="container">

      <h1>UXL Editor</h1>
      <textarea id="codeEditor">state count = 0
state name = "Guest"

text "Counter Application"
text "Hello {name}"
text "Count: {count}"

input name

button "Increase":
    onClick => count = count + 1

button "Decrease":
    onClick => count = count - 1

if count > 5:
    text "Count is too high"</textarea>
      <button class="run-btn" onclick="runUXL()">Run UXL</button>

  <script>
    let state = {};

    function evaluateCondition(variable, operator, value) {
      if (operator === ">") return state[variable] > value;
      if (operator === "<") return state[variable] < value;
      if (operator === "==") return state[variable] == value;
      if (operator === "!=") return state[variable] != value;
      return false;
    }

    function runUXL() {
      const code = document.getElementById("codeEditor").value;
      render(code);
    }

    function render(code) {
      const app = document.getElementById("app");
      app.innerHTML = "";

      const lines = code.split("\n");

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line === "") continue;

        if (line.startsWith("state")) {
          const match = line.match(/^state\s+(\w+)\s*=\s*(.+)$/);
          if (match) {
            const variable = match[1];
            let value = match[2].trim();

            if (!isNaN(value)) {
              state[variable] = Number(value);
            } else {
              state[variable] = value.replace(/"/g, "");
            }
          }
        }

        else if (line.startsWith("text")) {
          const match = line.match(/"(.*?)"/);
          if (match) {
            let content = match[1];

            content = content.replace(/\{(.*?)\}/g, (_, variable) => {
              return state[variable] ?? "";
            });

            const p = document.createElement("p");
            p.innerText = content;
            app.appendChild(p);
          }
        }

        else if (line.startsWith("input")) {
          const parts = line.split(" ");
          const variable = parts[1];

          const input = document.createElement("input");
          input.placeholder = variable;
          input.value = state[variable] || "";

          input.addEventListener("input", (e) => {
            state[variable] = e.target.value;
            render(code);
          });

          app.appendChild(input);
        }

        else if (line.startsWith("button")) {
          const match = line.match(/"(.*?)"/);
          const label = match ? match[1] : "Button";

          const nextLine = lines[i + 1] ? lines[i + 1].trim() : "";
          const eventMatch = nextLine.match(/onClick\s*=>\s*(\w+)\s*=\s*(\w+)\s*([+-])\s*(\d+)/);

          const button = document.createElement("button");
          button.innerText = label;

          if (eventMatch) {
            const target = eventMatch[1];
            const source = eventMatch[2];
            const operator = eventMatch[3];
            const amount = Number(eventMatch[4]);

            button.onclick = () => {
              if (operator === "+") {
                state[target] = Number(state[source]) + amount;
              }

              if (operator === "-") {
                state[target] = Number(state[source]) - amount;
              }

              render(code);
            };
          }

          app.appendChild(button);
        }

        else if (line.startsWith("if")) {
          const conditionMatch = line.match(/^if\s+(\w+)\s*(>|<|==|!=)\s*(\d+)\s*:/);

            const variable = conditionMatch[1];

                p.innerText = textMatch[1];
                app.appendChild(p);
              }
            }
          }
        }
      }
    }

  </script>
